<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OMEX Tesorería</title>

  <!-- Librerías externas por CDN (requieren internet): utilidades de estilo e íconos -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-200">
  <div class="flex h-screen">
    <aside id="sb" class="bg-slate-900 border-r border-slate-800 p-2 overflow-auto"></aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header id="hd" class="flex flex-wrap items-center gap-3 px-4 py-2 bg-slate-900 border-b border-slate-800"></header>
      <main id="main" class="flex-1 overflow-auto p-5"></main>
    </div>
  </div>

  <!-- Scripts propios. El orden importa (scripts clásicos que comparten el ámbito global): -->
  <script src="js/finance.js"></script>  <!-- 1. motor financiero (fórmulas) -->
  <script src="js/store.js"></script>    <!-- 2. base de datos local + reglas de negocio + datos demo -->
  <script src="js/api.js"></script>      <!-- 3. cliente: sesión, call(), apiService -->
  <script src="js/helpers.js"></script>  <!-- 4. utilidades de interfaz -->
  <script src="js/views.js"></script>    <!-- 5. pantallas -->
  <script src="js/actions.js"></script>  <!-- 6. acciones de botones y formularios -->
  <script src="js/app.js"></script>      <!-- 7. menú, cabecera, login y arranque -->
</body>
</html>
